<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="50%" style="stop-color:#0a1512"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="mlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#0ABAB5;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#0ABAB5;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:0"/>
    </linearGradient>
    <filter id="mglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="150" fill="url(#mbg)"/>
  <g opacity="0.04" stroke="#0ABAB5" stroke-width="0.5">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
  </g>
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#mlineGrad)"/>
  <rect x="0" y="148.5" width="1200" height="1.5" fill="url(#mlineGrad)"/>
  <g fill="none" stroke="#0ABAB5" stroke-width="1.5" opacity="0.5">
    <polyline points="30,15 15,15 15,35"/>
    <polyline points="1170,15 1185,15 1185,35"/>
    <polyline points="30,135 15,135 15,115"/>
    <polyline points="1170,135 1185,135 1185,115"/>
  </g>
  <g transform="translate(40,38)">
    <rect width="132" height="26" rx="13" fill="#0d2b1a" stroke="#22c55e" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="16" cy="13" r="4" fill="#22c55e" filter="url(#mglow)"/>
    <text x="30" y="17" font-family="'Fira Code',monospace" font-size="11" fill="#4ade80" letter-spacing="1">IN_PROGRESS</text>
  </g>
  <text x="40" y="90" font-family="'Fira Code','Courier New',monospace" font-size="20" font-weight="700" fill="#ffffff">&#127891; Internship Management Platform</text>
  <text x="40" y="118" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#a3adc2">A full software product for a university &#8212; covering the entire student-internship</text>
  <text x="40" y="136" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#a3adc2">workflow end to end. Owning product design, stepping into front-end wherever needed.</text>
  <g transform="translate(880,80)">
    <rect x="0" y="0" width="280" height="6" rx="3" fill="#1a2030"/>
    <rect x="0" y="0" width="182" height="6" rx="3" fill="#0ABAB5" filter="url(#mglow)"/>
    <text x="0" y="-10" font-family="'Fira Code',monospace" font-size="11" fill="#0ABAB5" opacity="0.8">PROGRESS ~65%</text>
  </g>
