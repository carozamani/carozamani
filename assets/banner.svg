<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="50%" style="stop-color:#0f0a1a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#A855F7;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#A855F7;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="8" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="200" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#A855F7" stroke-width="0.5">
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="240" y1="0" x2="240" y2="200"/><line x1="480" y1="0" x2="480" y2="200"/>
    <line x1="720" y1="0" x2="720" y2="200"/><line x1="960" y1="0" x2="960" y2="200"/>
  </g>
  <circle cx="180" cy="100" r="80" fill="#A855F7" opacity="0.06"/>
  <circle cx="1020" cy="100" r="80" fill="#A855F7" opacity="0.06"/>
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#lineGrad)"/>
  <g fill="none" stroke="#A855F7" stroke-width="1.5" opacity="0.6">
    <polyline points="30,15 15,15 15,35"/>
    <polyline points="1170,15 1185,15 1185,35"/>
    <polyline points="30,185 15,185 15,165"/>
    <polyline points="1170,185 1185,185 1185,165"/>
  </g>
  <text x="520" y="85" font-family="Fira Code,Courier New,monospace" font-size="13" fill="#A855F7" opacity="0.5" filter="url(#glow)">&#9658; carozamani.init()</text>
  <text x="600" y="125" text-anchor="middle" font-family="Fira Code,Courier New,monospace" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="3" filter="url(#softGlow)">carozamani</text>
  <text x="600" y="158" text-anchor="middle" font-family="Fira Code,Courier New,monospace" font-size="13" fill="#A855F7" letter-spacing="4" opacity="0.9">PRODUCT DESIGNER  x  FRONT-END DEVELOPER</text>
  <rect x="0" y="198.5" width="1200" height="1.5" fill="url(#lineGrad)"/>
</svg>
