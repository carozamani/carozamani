      <ellipse cx="0" cy="0" rx="24" ry="8.5" fill="none" stroke="#61DAFB" stroke-width="2.2"/>
      <ellipse cx="0" cy="0" rx="24" ry="8.5" fill="none" stroke="#61DAFB" stroke-width="2.2" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="24" ry="8.5" fill="none" stroke="#61DAFB" stroke-width="2.2" transform="rotate(120)"/>
    </g>
    <text x="36" y="90" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="12" fill="#a3adc2">React</text>
  </g>

  <g transform="translate(468,210)">
    <rect width="72" height="72" rx="16" fill="#12161f" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.3" filter="url(#chipGlow)"/>
    <rect x="16" y="16" width="40" height="40" rx="20" fill="#0d0d0d" stroke="#3B82F6" stroke-opacity="0.5"/>
    <text x="36" y="44" text-anchor="middle" font-family="'Fira Code',monospace" font-size="20" font-weight="700" fill="#ffffff">N</text>
    <text x="36" y="90" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="12" fill="#a3adc2">Next.js</text>
  </g>

  <g transform="translate(564,210)">
    <rect width="72" height="72" rx="16" fill="#12161f" stroke="#3178C6" stroke-opacity="0.45" stroke-width="1.3" filter="url(#chipGlow)"/>
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#3178C6"/>
    <text x="36" y="43" text-anchor="middle" font-family="'Fira Code',monospace" font-size="15" font-weight="700" fill="#ffffff">TS</text>
    <text x="36" y="90" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="12" fill="#a3adc2">TypeScript</text>
  </g>

  <g transform="translate(660,210)">
    <rect width="72" height="72" rx="16" fill="#12161f" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.3" filter="url(#chipGlow)"/>
    <rect x="16" y="16" width="40" height="40" rx="10" fill="#38BDF8"/>
    <path d="M22,36 q7,-9 14,0 q7,9 14,0" fill="none" stroke="#0d0d0d" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M22,45 q7,-9 14,0 q7,9 14,0" fill="none" stroke="#0d0d0d" stroke-width="2.4" stroke-linecap="round"/>
    <text x="36" y="90" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="12" fill="#a3adc2">Tailwind CSS</text>
  </g>

  <g transform="translate(756,210)">
    <rect width="72" height="72" rx="16" fill="#12161f" stroke="#F7DF1E" stroke-opacity="0.45" stroke-width="1.3" filter="url(#chipGlow)"/>
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#F7DF1E"/>
    <text x="36" y="43" text-anchor="middle" font-family="'Fira Code',monospace" font-size="15" font-weight="700" fill="#0d0d0d">JS</text>
    <text x="36" y="90" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="12" fill="#a3adc2">JavaScript</text>
  </g>

  <!-- ROW 3: DATABASE and EXPANDING -->
  <text x="600" y="356" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#3B82F6" opacity="0.8" letter-spacing="3">// DATABASE &amp; EXPANDING_INTO</text>

  <g transform="translate(516,370)">
    <rect width="72" height="72" rx="16" fill="#12161f" stroke="#336791" stroke-opacity="0.5" stroke-width="1.3" filter="url(#chipGlow)"/>
    <circle cx="36" cy="32" r="20" fill="#336791"/>
    <text x="36" y="38" text-anchor="middle" font-family="'Fira Code',monospace" font-size="13" font-weight="700" fill="#ffffff">PG</text>
    <text x="36" y="90" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="12" fill="#a3adc2">PostgreSQL</text>
  </g>

  <g transform="translate(612,370)">
    <rect width="72" height="72" rx="16" fill="#12161f" stroke="#FFD43B" stroke-opacity="0.45" stroke-width="1.3" filter="url(#chipGlow)"/>
    <g transform="translate(16,12)">
      <path d="M20,0 h12 a8,8 0 0,1 8,8 v12 h-28 v-8 a8,8 0 0,1 8,-8 z" fill="#306998"/>
      <path d="M20,40 h-12 a8,8 0 0,1 -8,-8 v-12 h28 v8 a8,8 0 0,1 -8,8 z" fill="#FFD43B"/>
      <circle cx="12" cy="6" r="2.2" fill="#ffffff"/>
      <circle cx="28" cy="34" r="2.2" fill="#0d0d0d"/>
    </g>
    <text x="36" y="90" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="12" fill="#a3adc2">Python</text>
  </g>
