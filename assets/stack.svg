  <text x="600" y="196" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#3B82F6" opacity="0.8" letter-spacing="3">// FRAMEWORKS &amp; LANGUAGES</text>

  <g transform="translate(372,210)">
    <rect width="72" height="72" rx="16" fill="#12161f" stroke="#61DAFB" stroke-opacity="0.4" stroke-width="1.3" filter="url(#chipGlow)"/>
    <g transform="translate(36,36)">
