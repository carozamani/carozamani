<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="50%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="slineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#3B82F6;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#3B82F6;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:0"/>
    </linearGradient>
    <filter id="chipGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="500" fill="url(#sbg)"/>
  <g opacity="0.04" stroke="#3B82F6" stroke-width="0.5">
    <line x1="0" y1="125" x2="1200" y2="125"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="375" x2="1200" y2="375"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="900" y1="0" x2="900" y2="500"/>
  </g>
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#slineGrad)"/>
  <rect x="0" y="498.5" width="1200" height="1.5" fill="url(#slineGrad)"/>
  <g fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.5">
    <polyline points="30,15 15,15 15,35"/>
    <polyline points="1170,15 1185,15 1185,35"/>
    <polyline points="30,485 15,485 15,465"/>
    <polyline points="1170,485 1185,485 1185,465"/>
  </g>

  <!-- ROW 1: DESIGN -->
  <text x="600" y="36" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#3B82F6" opacity="0.8" letter-spacing="3">// DESIGN</text>

  <g transform="translate(516,50)">
    <rect width="72" height="72" rx="16" fill="#12161f" stroke="#F24E1E" stroke-opacity="0.4" stroke-width="1.3" filter="url(#chipGlow)"/>
    <g transform="translate(23,16)">
      <rect x="0" y="0" width="13" height="13" rx="6.5" fill="#F24E1E"/>
      <rect x="13" y="0" width="13" height="13" rx="6.5" fill="#FF7262"/>
      <rect x="0" y="13" width="13" height="13" rx="6.5" fill="#A259FF"/>
      <circle cx="19.5" cy="19.5" r="6.5" fill="#1ABCFE"/>
      <path d="M0,26 h13 v6.5 a6.5,6.5 0 0,1 -13,0 Z" fill="#0ACF83"/>
    </g>
    <text x="36" y="90" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="12" fill="#a3adc2">Figma</text>
  </g>

  <g transform="translate(612,50)">
    <rect width="72" height="72" rx="16" fill="#12161f" stroke="#FF61F6" stroke-opacity="0.4" stroke-width="1.3" filter="url(#chipGlow)"/>
    <rect x="16" y="16" width="40" height="40" rx="10" fill="#FF61F6"/>
    <text x="36" y="43" text-anchor="middle" font-family="'Fira Code',monospace" font-size="18" font-weight="700" fill="#0d0d0d">Xd</text>
    <text x="36" y="90" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="12" fill="#a3adc2">Adobe XD</text>
  </g>

